          value: !lambda "return x;"

# Supprime les thermostats non utilisés
  - id: !remove ${nombre_thermostats | int < 2 and "thermostat_climat_k2"}
  - id: !remove ${nombre_thermostats | int < 3 and "thermostat_climat_k3"}
  - id: !remove ${nombre_thermostats | int < 4 and "thermostat_climat_k4"}
  - id: !remove ${nombre_thermostats | int < 5 and "thermostat_climat_k5"}
  - id: !remove ${nombre_thermostats | int < 6 and "thermostat_climat_k6"}
  - id: !remove ${nombre_thermostats | int < 7 and "thermostat_climat_k7"}
  - id: !remove ${nombre_thermostats | int < 8 and "thermostat_climat_k8"}
  - id: !remove ${nombre_thermostats | int < 9 and "thermostat_climat_k9"}
